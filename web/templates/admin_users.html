<div id="adminUsersBox" class="admin-popup-window" role="dialog" aria-modal="true" aria-labelledby="adminUsersBoxHeader">

    <!-- Header -->
    <div class="admin-header" id="adminUsersBoxHeader">
        <h2>Registered Users</h2>
        <button id="closeAdminUsers" class="close-btn" type="button" aria-label="Close user management">&times;</button>
    </div>

    <!-- Content -->
    <div class="admin-content">
        <table class="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Users will load dynamically here -->
            </tbody>
        </table>
    </div>
</div>
