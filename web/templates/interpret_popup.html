<div id="interpretPopup" class="interpret-popup popup-window" role="dialog" aria-modal="true" aria-labelledby="interpretHeader">

    <div class="interpret-header" id="interpretHeader">
        <span>Text Interpreter</span>
        <button id="closeInterpretPopup" type="button" aria-label="Close text interpreter">&times;</button>
    </div>

    <div class="interpret-body">

        <input type="file" id="textFileInput" accept=".txt,text/plain" aria-label="Choose a plain text file">

        <div class="interpret-main">

            <div class="interpret-left">

                <img id="interpretImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Current sign reference">

                <div id="currentWord" aria-live="polite"></div>

                <div class="controls">

                    <button id="startBtn" type="button">Start Over</button>
                    <button id="prevBtn" type="button">Previous</button>
                    <button id="playBtn" type="button">Play</button>
                    <button id="pauseBtn" type="button">Pause</button>
                    <button id="nextBtn" type="button">Next</button>

                </div>

                <label for="speedSlider">Playback speed</label>
                <input type="range" id="speedSlider" min="200" max="2000" value="800">

            </div>

            <div class="interpret-right">

                <div id="textDisplay">Choose a .txt file to begin.</div>

            </div>

        </div>

    </div>

</div>
