<div id="videoPopup" class="video-popup popup-window" role="dialog" aria-modal="true" aria-labelledby="videoPopupHeader">

    <!-- Header -->
    <div class="video-header" id="videoPopupHeader" role="banner" aria-label="Communication tools header">
        <span>Communication Tools</span>
        <button id="closeVideoPopup" class="close-btn" type="button" aria-label="Close communication tools">&times;</button>
    </div>

    <!-- Content -->
    <div class="video-content" role="region" aria-label="Available communication tools">

        <div class="video-option" role="button" tabindex="0" aria-label="Open sign to voice">
            <i class="fas fa-hands" aria-hidden="true"></i>
            <div class="option-text">
                <h4>Sign to Text and Voice</h4>
                <p>Recognize supported hand signs and turn the confirmed text into speech.</p>
            </div>
        </div>

        <div class="video-option" id="interpretTextBtn" role="button" tabindex="0" aria-label="Open text interpreter">
            <i class="fas fa-language" aria-hidden="true"></i>
            <div class="option-text">
                <h4>Text Interpreter</h4>
                <p>Read a text file using the available alphabet sign images.</p>
            </div>
        </div>

        <div class="video-option" id="voiceCommBtn" role="button" tabindex="0" aria-label="Open voice communication">
            <i class="fas fa-microphone" aria-hidden="true"></i>
            <div class="option-text">
                <h4>Voice to Text</h4>
                <p>Record a short message and display the recognized words.</p>
            </div>
        </div>

    </div>

</div>
