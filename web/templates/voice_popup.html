<div id="voicePopup" class="voice-popup popup-window" role="dialog" aria-modal="true" aria-labelledby="voiceHeader">

    <div class="voice-header" id="voiceHeader">
        <span>Voice to Text</span>
        <button id="closeVoicePopup" type="button" aria-label="Close voice to text">&times;</button>
    </div>

    <div class="voice-body">

        <h4>Status</h4>
        <div id="voiceStatus" aria-live="polite">Press Enter when you are ready to record.</div>

        <h4>Recognized Text</h4>
        <div id="voiceResult" aria-live="polite"></div>

        <p style="margin-top:10px;font-size:14px;">
            Keyboard controls:<br>
            Enter → Start or stop recording<br>
            J → Discard the recognized message<br>
            K → Save the recognized message<br>
            F → Start again
        </p>

    </div>

</div>
