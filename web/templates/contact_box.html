<div id="contactBox" class="contact-box popup-window" role="dialog" aria-modal="true" aria-labelledby="contactBoxHeader">

    <!-- Header -->
    <div class="contact-header" id="contactBoxHeader" role="banner" aria-label="Project contact header">
        <span>Project Contact</span>
        <button id="closeContact" class="close-btn" type="button" aria-label="Close project contact">&times;</button>
    </div>

    <!-- Content -->
    <div class="contact-content" role="region" aria-label="Project contact information">

        <!-- Profile Section -->
        <div class="owner-profile" role="group" aria-label="Project owner">
            <img src="https://i.pravatar.cc/80" class="owner-avatar" alt="Project owner avatar">
            <div>
                <h3>HashTagNoob</h3>
                <p class="owner-role">Project Owner</p>
            </div>
        </div>

        <hr>

        <!-- Contact Info -->
        <div class="contact-info" role="group" aria-label="Contact details">

            <div class="info-item" aria-label="Email address">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span>HashTagNoob@gmail.com</span>
            </div>

            <div class="info-item" aria-label="Phone number">
                <i class="fas fa-phone" aria-hidden="true"></i>
                <span>+123456789</span>
            </div>

            <div class="info-item" aria-label="Location">
                <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                <span>Pokhara, Nepal</span>
            </div>

            <div class="info-item" aria-label="Available hours">
                <i class="fas fa-clock" aria-hidden="true"></i>
                <span>Monday–Friday, 9:00 AM–6:00 PM</span>
            </div>

        </div>

    </div>

</div>
